# Copy to secrets.yaml (gitignored) next to the device YAML and fill in.
api_encryption_key: "<32-byte base64 key, e.g. from `openssl rand -base64 32`>"
ota_password: "<only needed while migrating to OTA encryption>"

# Where the panel loads its icons from: HA serves /config/www/ at /local/.
# Use an address of HA the panel can reach directly (no TLS).
ev_panel_asset_base: "http://192.168.1.10:8123/local/ev-panel/icons"

# Static Ethernet address of the panel.
ev_panel_static_ip: 192.168.1.20
ev_panel_gateway: 192.168.1.1
ev_panel_subnet: 255.255.255.0
ev_panel_dns: 192.168.1.1
