# Wärmepumpe + Boiler — Zähler-Zyklen auf dem Shelly-Pro-3EM-Energiezähler.
#
# 2026-09-03: Quelle war sensor.wp_und_boiler_total_active_energy. Diese Entität
# existiert nicht mehr — die Shelly-Integration hat die Entitäten auf
# heizungsraum_*_energy_meter_N_* umbenannt und dabei die kombinierte
# Total-Entität fallen lassen. Folge: daily/monthly standen auf 0 und die
# COP-Templates (templates/wp_cop_*.yaml) rechneten gegen Null.
#
# Neue Quelle = der Hardware-Zähler von KANAL 0. Der Shelly ist inzwischen so
# verdrahtet/konfiguriert, dass die WP allein auf Kanal 0 hängt (einphasig) —
# darum genau dieser Kanal und keine Summe über 0/1/2.
# Die Entität war in der Registry vorhanden, aber deaktiviert; am 2026-09-03
# aktiviert (Stand damals 74.68 kWh).
#
# Ein Hardware-Zähler ist einer Riemann-Summe aus der Leistung vorzuziehen:
# keine Drift, übersteht HA-Neustarts. utility_meter merkt sich beim ersten
# Update den aktuellen Zählerstand als Basis und zählt ab da nur Deltas — die
# bestehenden Quartals-/Jahreswerte springen also NICHT um 74.68 kWh.
daily_energy_wp:
  name: Daily Energy Wärmepumpe
  source: sensor.heizungsraum_wp_und_boiler_energy_meter_0_energy
  cycle: daily
monthly_energy_wp:
  name: Monthly Energy Wärmepumpe
  source: sensor.heizungsraum_wp_und_boiler_energy_meter_0_energy
  cycle: monthly
quarterly_energy_wp:
  name: Quarterly Energy Wärmepumpe
  source: sensor.heizungsraum_wp_und_boiler_energy_meter_0_energy
  cron: "0 0 1 1,4,7,10 *"
yearly_energy_wp:
  name: Yearly Energy Wärmepumpe
  source: sensor.heizungsraum_wp_und_boiler_energy_meter_0_energy
  cycle: yearly
