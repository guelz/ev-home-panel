# =============================================================================
# Custom Energy-Dashboard power sensors (Huawei Solar)
# =============================================================================
# Derives a complete, internally-consistent power-flow breakdown from three
# raw Huawei Solar sensors. All values are in Watts.
#
# Source sensors & confirmed sign conventions:
#   sensor.inverter_active_power            INV   AC output. + = delivering, - = consuming (grid-charging)
#   sensor.power_meter_active_power         GRID  + = EXPORT to grid, - = IMPORT from grid
#   sensor.batteries_charge_discharge_power BCDP  + = CHARGING,        - = DISCHARGING
#   sensor.inverter_input_power             PV(DC) direct PV string input (headline value only)
#
# Derived base values (AC-side, used for the allocation):
#   PV    = max(INV + BCDP, 0)     verified: 594 + (-74) = 520 W
#   House = max(INV - GRID, 0)     verified: 594 - (-14) = 608 W
#
# Cross-flow allocation priority (waterfall):
#   1. PV    -> House,  then -> Battery (charge), then -> Grid (export)
#   2. House <- Battery (discharge), then <- Grid (import)
#   3. Battery-charge remainder <- Grid (import)
# Guarantees: PV sinks sum to PV(AC); House sources sum to House consumption.
#
# NOTE: model has no Battery->Grid path (battery is assumed to feed the house
# only, exports come from PV only). True >99% of the time; in the rare case the
# battery discharges WHILE exporting, the surplus is dropped from the breakdown.
#
# Usage: include this file from configuration.yaml, e.g.
#   template: !include Energy_Dashboard/dash_power_sensors.yaml
# (or merge its `- sensor:` block into your existing top-level `template:` list).
# =============================================================================

- sensor:

    # -------------------------------------------------------------------------
    # BASE VALUES
    # -------------------------------------------------------------------------

    - name: "Dash PV Input Power"
      unique_id: dash_pv_input_power
      unit_of_measurement: W
      device_class: power
      state_class: measurement
      # DC PV string power straight from the inverter — clean, no Modbus read-skew.
      # (inverter_active_power + batteries_charge_discharge_power glitches: the two
      # registers are polled seconds apart, so on battery charge/discharge
      # transitions the sum spikes/dips, e.g. a false 11.4 kW at 10:50.)
      availability: >
        {{ states('sensor.inverter_input_power') not in ['unknown','unavailable','none'] }}
      state: >
        {{ [states('sensor.inverter_input_power') | float(0), 0] | max | round(0) }}

    - name: "Dash Grid Import Power"
      unique_id: dash_grid_import_power
      unit_of_measurement: W
      device_class: power
      state_class: measurement
      availability: >
        {{ states('sensor.power_meter_active_power') not in ['unknown','unavailable','none'] }}
      state: >
        {{ [-(states('sensor.power_meter_active_power') | float(0)), 0] | max | round(0) }}

    - name: "Dash Grid Export Power"
      unique_id: dash_grid_export_power
      unit_of_measurement: W
      device_class: power
      state_class: measurement
      availability: >
        {{ states('sensor.power_meter_active_power') not in ['unknown','unavailable','none'] }}
      state: >
        {{ [states('sensor.power_meter_active_power') | float(0), 0] | max | round(0) }}

    - name: "Dash Battery Charge Power"
      unique_id: dash_bat_charge_power
      unit_of_measurement: W
      device_class: power
      state_class: measurement
      availability: >
        {{ states('sensor.batteries_charge_discharge_power') not in ['unknown','unavailable','none'] }}
      state: >
        {{ [states('sensor.batteries_charge_discharge_power') | float(0), 0] | max | round(0) }}

    - name: "Dash Battery Discharge Power"
      unique_id: dash_bat_discharge_power
      unit_of_measurement: W
      device_class: power
      state_class: measurement
      availability: >
        {{ states('sensor.batteries_charge_discharge_power') not in ['unknown','unavailable','none'] }}
      state: >
        {{ [-(states('sensor.batteries_charge_discharge_power') | float(0)), 0] | max | round(0) }}

    - name: "Dash House Consumption"
      unique_id: dash_house_consumption
      unit_of_measurement: W
      device_class: power
      state_class: measurement
      availability: >
        {{ states('sensor.inverter_active_power') not in ['unknown','unavailable','none']
           and states('sensor.power_meter_active_power') not in ['unknown','unavailable','none'] }}
      state: >
        {% set inv  = states('sensor.inverter_active_power') | float(0) %}
        {% set grid = states('sensor.power_meter_active_power') | float(0) %}
        {{ [inv - grid, 0] | max | round(0) }}

    # -------------------------------------------------------------------------
    # CROSS-FLOWS (primary calculations)
    # Each recomputes the full allocation from raw sensors so it is independent
    # and always self-consistent.
    # -------------------------------------------------------------------------

    - name: "Dash PV to House"
      unique_id: dash_pv_to_house
      unit_of_measurement: W
      device_class: power
      state_class: measurement
      availability: >
        {{ states('sensor.inverter_active_power') not in ['unknown','unavailable','none']
           and states('sensor.power_meter_active_power') not in ['unknown','unavailable','none']
           and states('sensor.batteries_charge_discharge_power') not in ['unknown','unavailable','none'] }}
      state: >
        {% set inv  = states('sensor.inverter_active_power') | float(0) %}
        {% set bcdp = states('sensor.batteries_charge_discharge_power') | float(0) %}
        {% set grid = states('sensor.power_meter_active_power') | float(0) %}
        {% set pv = [inv + bcdp, 0] | max %}
        {% set h  = [inv - grid, 0] | max %}
        {% set pv_to_house = [pv, h] | min %}
        {{ pv_to_house | round(0) }}

    - name: "Dash PV to Batteries"
      unique_id: dash_pv_to_batteries
      unit_of_measurement: W
      device_class: power
      state_class: measurement
      availability: >
        {{ states('sensor.inverter_active_power') not in ['unknown','unavailable','none']
           and states('sensor.power_meter_active_power') not in ['unknown','unavailable','none']
           and states('sensor.batteries_charge_discharge_power') not in ['unknown','unavailable','none'] }}
      state: >
        {% set inv  = states('sensor.inverter_active_power') | float(0) %}
        {% set bcdp = states('sensor.batteries_charge_discharge_power') | float(0) %}
        {% set grid = states('sensor.power_meter_active_power') | float(0) %}
        {% set pv = [inv + bcdp, 0] | max %}
        {% set bc = [bcdp, 0] | max %}
        {% set h  = [inv - grid, 0] | max %}
        {% set pv_to_house = [pv, h] | min %}
        {% set pv_rem = pv - pv_to_house %}
        {% set pv_to_batt = [pv_rem, bc] | min %}
        {{ pv_to_batt | round(0) }}

    - name: "Dash PV to Grid"
      unique_id: dash_pv_to_grid
      unit_of_measurement: W
      device_class: power
      state_class: measurement
      availability: >
        {{ states('sensor.inverter_active_power') not in ['unknown','unavailable','none']
           and states('sensor.power_meter_active_power') not in ['unknown','unavailable','none']
           and states('sensor.batteries_charge_discharge_power') not in ['unknown','unavailable','none'] }}
      state: >
        {% set inv  = states('sensor.inverter_active_power') | float(0) %}
        {% set bcdp = states('sensor.batteries_charge_discharge_power') | float(0) %}
        {% set grid = states('sensor.power_meter_active_power') | float(0) %}
        {% set pv = [inv + bcdp, 0] | max %}
        {% set bc = [bcdp, 0] | max %}
        {% set h  = [inv - grid, 0] | max %}
        {% set pv_to_house = [pv, h] | min %}
        {% set pv_rem = pv - pv_to_house %}
        {% set pv_to_batt = [pv_rem, bc] | min %}
        {% set pv_to_grid = pv_rem - pv_to_batt %}
        {{ pv_to_grid | round(0) }}

    - name: "Dash Battery to House"
      unique_id: dash_bat_to_house
      unit_of_measurement: W
      device_class: power
      state_class: measurement
      availability: >
        {{ states('sensor.inverter_active_power') not in ['unknown','unavailable','none']
           and states('sensor.power_meter_active_power') not in ['unknown','unavailable','none']
           and states('sensor.batteries_charge_discharge_power') not in ['unknown','unavailable','none'] }}
      state: >
        {% set inv  = states('sensor.inverter_active_power') | float(0) %}
        {% set bcdp = states('sensor.batteries_charge_discharge_power') | float(0) %}
        {% set grid = states('sensor.power_meter_active_power') | float(0) %}
        {% set pv = [inv + bcdp, 0] | max %}
        {% set bd = [-bcdp, 0] | max %}
        {% set h  = [inv - grid, 0] | max %}
        {% set pv_to_house = [pv, h] | min %}
        {% set h_rem = h - pv_to_house %}
        {% set batt_to_house = [bd, h_rem] | min %}
        {{ batt_to_house | round(0) }}

    - name: "Dash Grid to House"
      unique_id: dash_grid_to_house
      unit_of_measurement: W
      device_class: power
      state_class: measurement
      availability: >
        {{ states('sensor.inverter_active_power') not in ['unknown','unavailable','none']
           and states('sensor.power_meter_active_power') not in ['unknown','unavailable','none']
           and states('sensor.batteries_charge_discharge_power') not in ['unknown','unavailable','none'] }}
      state: >
        {% set inv  = states('sensor.inverter_active_power') | float(0) %}
        {% set bcdp = states('sensor.batteries_charge_discharge_power') | float(0) %}
        {% set grid = states('sensor.power_meter_active_power') | float(0) %}
        {% set pv = [inv + bcdp, 0] | max %}
        {% set bd = [-bcdp, 0] | max %}
        {% set h  = [inv - grid, 0] | max %}
        {% set pv_to_house = [pv, h] | min %}
        {% set h_rem = h - pv_to_house %}
        {% set batt_to_house = [bd, h_rem] | min %}
        {% set grid_to_house = h_rem - batt_to_house %}
        {{ grid_to_house | round(0) }}

    - name: "Dash Grid to Batteries"
      unique_id: dash_grid_to_batteries
      unit_of_measurement: W
      device_class: power
      state_class: measurement
      availability: >
        {{ states('sensor.inverter_active_power') not in ['unknown','unavailable','none']
           and states('sensor.power_meter_active_power') not in ['unknown','unavailable','none']
           and states('sensor.batteries_charge_discharge_power') not in ['unknown','unavailable','none'] }}
      state: >
        {% set inv  = states('sensor.inverter_active_power') | float(0) %}
        {% set bcdp = states('sensor.batteries_charge_discharge_power') | float(0) %}
        {% set grid = states('sensor.power_meter_active_power') | float(0) %}
        {% set pv = [inv + bcdp, 0] | max %}
        {% set bc = [bcdp, 0] | max %}
        {% set h  = [inv - grid, 0] | max %}
        {% set pv_to_house = [pv, h] | min %}
        {% set pv_rem = pv - pv_to_house %}
        {% set pv_to_batt = [pv_rem, bc] | min %}
        {% set grid_to_batt = bc - pv_to_batt %}
        {{ grid_to_batt | round(0) }}

    # -------------------------------------------------------------------------
    # DUPLICATE VIEWS (same flow, second name) -- reference the primary sensor
    # so there is a single source of truth and no drift.
    # -------------------------------------------------------------------------

    - name: "Dash Grid from PV"
      unique_id: dash_grid_from_pv
      unit_of_measurement: W
      device_class: power
      state_class: measurement
      availability: "{{ states('sensor.dash_pv_to_grid') not in ['unknown','unavailable','none'] }}"
      state: "{{ states('sensor.dash_pv_to_grid') | float(0) | round(0) }}"

    - name: "Dash Battery from PV"
      unique_id: dash_bat_from_pv
      unit_of_measurement: W
      device_class: power
      state_class: measurement
      availability: "{{ states('sensor.dash_pv_to_batteries') not in ['unknown','unavailable','none'] }}"
      state: "{{ states('sensor.dash_pv_to_batteries') | float(0) | round(0) }}"

    - name: "Dash Battery from Grid"
      unique_id: dash_bat_from_grid
      unit_of_measurement: W
      device_class: power
      state_class: measurement
      availability: "{{ states('sensor.dash_grid_to_batteries') not in ['unknown','unavailable','none'] }}"
      state: "{{ states('sensor.dash_grid_to_batteries') | float(0) | round(0) }}"

    - name: "Dash House from PV"
      unique_id: dash_house_from_pv
      unit_of_measurement: W
      device_class: power
      state_class: measurement
      availability: "{{ states('sensor.dash_pv_to_house') not in ['unknown','unavailable','none'] }}"
      state: "{{ states('sensor.dash_pv_to_house') | float(0) | round(0) }}"

    - name: "Dash House from Grid"
      unique_id: dash_house_from_grid
      unit_of_measurement: W
      device_class: power
      state_class: measurement
      availability: "{{ states('sensor.dash_grid_to_house') not in ['unknown','unavailable','none'] }}"
      state: "{{ states('sensor.dash_grid_to_house') | float(0) | round(0) }}"

    - name: "Dash House from Batteries"
      unique_id: dash_house_from_batteries
      unit_of_measurement: W
      device_class: power
      state_class: measurement
      availability: "{{ states('sensor.dash_battery_to_house') not in ['unknown','unavailable','none'] }}"
      state: "{{ states('sensor.dash_battery_to_house') | float(0) | round(0) }}"

    - name: "Dash Balance Check"
      unique_id: dash_balance_check
      unit_of_measurement: W
      device_class: power
      state_class: measurement
      state: >
        {% set inv  = states('sensor.inverter_active_power') | float(0) %}
        {% set bcdp = states('sensor.batteries_charge_discharge_power') | float(0) %}
        {% set pv_ac = [inv + bcdp, 0] | max %}
        {% set src = pv_ac
                   + states('sensor.dash_battery_discharge_power')|float(0)
                   + states('sensor.dash_grid_import_power')|float(0) %}
        {% set snk = states('sensor.dash_house_consumption')|float(0)
                   + states('sensor.dash_battery_charge_power')|float(0)
                   + states('sensor.dash_grid_export_power')|float(0) %}
        {{ (src - snk) | round(0) }}