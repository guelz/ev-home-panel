# EV-Panel page 3 — weather forecast + letzter-Regen template sensors.
# Deploy to /config/templates/ev_panel_weather.yaml
# weather.forecast_home = HA's default Met.no entity — use your own weather entity.
# (configuration.yaml merges templates/ via `template: !include_dir_merge_list`).
#
# Consumed by the EV-Panel ESPHome build (ev-panel/common/ha_entities.yaml):
#   sensor.evp_weather_d{0..4}_high / _low   (°C)
#   sensor.evp_weather_d{0..4}_cond          (HA condition string → MDI glyph)
#   sensor.evp_letzter_regen                 (timestamp, survives restarts)
#   sensor.evp_letzter_regen_text            (German relative: heute/gestern/vor N Tagen)

# ── 5-day daily forecast snapshot (refreshed on weather change + hourly + HA start) ──
- trigger:
    - trigger: state
      entity_id: weather.forecast_home
    - trigger: time_pattern
      hours: "/1"
    - trigger: homeassistant
      event: start
  action:
    - action: weather.get_forecasts
      target:
        entity_id: weather.forecast_home
      data:
        type: daily
      response_variable: forecast_data
  sensor:
    - name: "EVP Weather D0 High"
      unique_id: evp_weather_d0_high
      unit_of_measurement: "°C"
      state: "{{ forecast_data['weather.forecast_home'].forecast[0].temperature | default('unknown') }}"
    - name: "EVP Weather D0 Low"
      unique_id: evp_weather_d0_low
      unit_of_measurement: "°C"
      state: "{{ forecast_data['weather.forecast_home'].forecast[0].templow | default('unknown') }}"
    - name: "EVP Weather D0 Cond"
      unique_id: evp_weather_d0_cond
      state: "{{ forecast_data['weather.forecast_home'].forecast[0].condition | default('cloudy') }}"
    - name: "EVP Weather D1 High"
      unique_id: evp_weather_d1_high
      unit_of_measurement: "°C"
      state: "{{ forecast_data['weather.forecast_home'].forecast[1].temperature | default('unknown') }}"
    - name: "EVP Weather D1 Low"
      unique_id: evp_weather_d1_low
      unit_of_measurement: "°C"
      state: "{{ forecast_data['weather.forecast_home'].forecast[1].templow | default('unknown') }}"
    - name: "EVP Weather D1 Cond"
      unique_id: evp_weather_d1_cond
      state: "{{ forecast_data['weather.forecast_home'].forecast[1].condition | default('cloudy') }}"
    - name: "EVP Weather D2 High"
      unique_id: evp_weather_d2_high
      unit_of_measurement: "°C"
      state: "{{ forecast_data['weather.forecast_home'].forecast[2].temperature | default('unknown') }}"
    - name: "EVP Weather D2 Low"
      unique_id: evp_weather_d2_low
      unit_of_measurement: "°C"
      state: "{{ forecast_data['weather.forecast_home'].forecast[2].templow | default('unknown') }}"
    - name: "EVP Weather D2 Cond"
      unique_id: evp_weather_d2_cond
      state: "{{ forecast_data['weather.forecast_home'].forecast[2].condition | default('cloudy') }}"
    - name: "EVP Weather D3 High"
      unique_id: evp_weather_d3_high
      unit_of_measurement: "°C"
      state: "{{ forecast_data['weather.forecast_home'].forecast[3].temperature | default('unknown') }}"
    - name: "EVP Weather D3 Low"
      unique_id: evp_weather_d3_low
      unit_of_measurement: "°C"
      state: "{{ forecast_data['weather.forecast_home'].forecast[3].templow | default('unknown') }}"
    - name: "EVP Weather D3 Cond"
      unique_id: evp_weather_d3_cond
      state: "{{ forecast_data['weather.forecast_home'].forecast[3].condition | default('cloudy') }}"
    - name: "EVP Weather D4 High"
      unique_id: evp_weather_d4_high
      unit_of_measurement: "°C"
      state: "{{ forecast_data['weather.forecast_home'].forecast[4].temperature | default('unknown') }}"
    - name: "EVP Weather D4 Low"
      unique_id: evp_weather_d4_low
      unit_of_measurement: "°C"
      state: "{{ forecast_data['weather.forecast_home'].forecast[4].templow | default('unknown') }}"
    - name: "EVP Weather D4 Cond"
      unique_id: evp_weather_d4_cond
      state: "{{ forecast_data['weather.forecast_home'].forecast[4].condition | default('cloudy') }}"

# ── letzter Regen — timestamp captured when binary_sensor.regen flips on.
#    Trigger-based template sensors persist across HA restarts.
- trigger:
    - trigger: state
      entity_id: binary_sensor.regen
      to: "on"
  sensor:
    - name: "EVP Letzter Regen"
      unique_id: evp_letzter_regen
      device_class: timestamp
      state: "{{ now().isoformat() }}"

# ── German relative text for the panel ("heute" / "gestern" / "vor N Tagen").
#    now() reference keeps it re-rendering so the day count rolls over at midnight.
- sensor:
    - name: "EVP Letzter Regen Text"
      unique_id: evp_letzter_regen_text
      state: >
        {% set ts = states('sensor.evp_letzter_regen') %}
        {% if ts in ['unknown', 'unavailable', 'none'] %}
          —
        {% else %}
          {% set days = (now().date() - as_datetime(ts).date()).days %}
          {{ 'heute' if days == 0 else 'gestern' if days == 1 else 'vor ' ~ days ~ ' Tagen' }}
        {% endif %}
