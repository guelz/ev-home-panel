# EV-Panel — §4 CLIMATE (108 px) — single "Vorklimatisieren" toggle.
# Paper-tint band, paper-fill button, 3px ink border that flips to $ok_green
# while active. Border colour is the only "I pressed it" feedback.
#
# Tapping ON calls homeassistant.turn_on on the entity, OFF homeassistant.turn_off.
# That works for a switch.* (kia_uvo's switch.<car>_climate) and for a climate.*
# entity alike — no hvac_mode guessing (kia_uvo's climate entity only accepts
# off/auto, so the old hvac_mode "cool" was rejected by HA and did nothing).
# The car does the actual pre-conditioning and stops by itself after ~30 min
# (measured 2026-11-26). A 30-min climate_border_timer (scripts_ui.yaml) only
# resets the green border + local climate_active state — it does NOT send "off".
# Deliberately not tied to the HA state: kia_uvo learns about changes (e.g. off
# in the Kia app) only via the slow Kia cloud poll.
#
# Required substitutions:
#   ${ha_climate_entity}  — HA switch or climate entity (e.g. switch.niro_climate)

obj:
  id: sec_climate
  width: 100%
  height: 108
  bg_color: $paper_tint
  bg_opa: COVER
  border_width: 0
  scrollable: false
  pad_left: 14
  pad_right: 14
  pad_top: 9
  pad_bottom: 9
  layout:
    type: FLEX
    flex_flow: ROW
    pad_column: 14
  widgets:
    # ── Vorklimatisieren (toggle) ──
    - button:
        id: precond_btn
        flex_grow: 1
        height: 90
        bg_color: $paper
        bg_opa: COVER
        border_color: $ink
        border_width: 3
        radius: 8
        shadow_width: 0
        pad_all: 10
        layout:
          type: FLEX
          flex_flow: ROW
          flex_align_main: CENTER
          flex_align_cross: CENTER
          pad_column: 14
        widgets:
          - image:
              id: precool_icon
              src: img_loading        # online_image img_precooling; swapped in by refresh_after_assets
          - label:
              flex_grow: 1
              text: "$txt_climate_button"
              text_font: font_status
              text_color: $ink
              text_align: CENTER
          - image:
              id: preheat_icon
              src: img_loading        # online_image img_preheating; swapped in by refresh_after_assets
        on_click:
          - script.execute: beep_click
          - if:
              condition:
                lambda: 'return !id(climate_active);'
              then:                     # OFF → ON
                - lambda: |-
                    id(climate_active) = true;
                    lv_obj_set_style_border_color(id(precond_btn), lv_color_hex($ok_green), 0);
                - homeassistant.action:
                    action: homeassistant.turn_on
                    data:
                      entity_id: ${ha_climate_entity}
                - script.execute: climate_border_timer
              else:                     # ON → OFF
                - lambda: |-
                    id(climate_active) = false;
                    lv_obj_set_style_border_color(id(precond_btn), lv_color_hex($ink), 0);
                - homeassistant.action:
                    action: homeassistant.turn_off
                    data:
                      entity_id: ${ha_climate_entity}
                - script.stop: climate_border_timer
