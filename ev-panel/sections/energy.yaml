          - label: { align: TOP_MID, text: "$txt_en_house", text_font: font_section_title, text_color: $ink_mute, text_letter_space: 3, bg_opa: TRANSP, border_width: 0 }

    # ───────────── WP (single) — 660,145 r66 (straight above Haus) ─────────────
