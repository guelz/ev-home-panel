# EV-Panel — every visible text (German), plus the glyph sets that must cover it.
# Merged into the device YAML's substitutions:
#   substitutions:
#     <<: !include ../ev-panel/texts_de.yaml
#
# Translating:
#   1. Copy this file to texts_<lang>.yaml and change the include line above in
#      the device YAML.
#   2. Translate the values. Keep the double quotes; never use " or \ inside a
#      value (it ends up in C string literals), and no "$" (it would be read
#      as a substitution). "\n" is a line break, but only in the texts that
#      already have one (LVGL labels) — elsewhere it breaks the C code.
#   3. *_fmt values are printf formats: keep the placeholders listed under
#      "# args:" in the same order and count, and write "%%" for a literal %.
#      "# max N bytes" is the buffer size (UTF-8: ä/ö/ü/— count 2–3 bytes;
#      numbers count at their widest, e.g. %d = 11) — longer text is cut off.
#   4. Make sure default_glyphs (and glyphs_kw / glyphs_wb_power) contain every
#      character you use,
#      then run:  python3 scripts/check_glyphs.py ev-panel/texts_<lang>.yaml
#
# Order follows the screen: page 1 (Laden) → page 2 (Energie) → page 3
# (Wetter + Zisterne), then the statusbar and air banner shown on every page.
# German texts use Swiss spelling (ss, never ß).

# Every font that renders text uses this set (Latin + German umlauts).
default_glyphs: " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~°·—–ÄÖÜßäöü€…"

