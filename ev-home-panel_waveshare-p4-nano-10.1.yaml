# =============================================================================
# EV-Panel — Waveshare ESP32-P4-NANO + 10.1" DSI panel + LD2412 (the author's wall panel)
# =============================================================================
# Hardware: ESP32-P4 ECO2 (rev1.3), Waveshare 10.1" DSI-TOUCH-B, HLK-LD2412 mmWave.
# Universal IDs:  ev_display, ev_touchscreen, backlight  (so the shared package
# code is hardware-agnostic).
#
# Common bits live in ev-panel/common/ (loaded via packages:) and ev-panel/sections/
# (loaded via !include inside the lvgl widgets list).
# =============================================================================

substitutions:
  # All visible texts + their glyph sets. Translate by swapping this file.
  <<: !include ev-panel/texts_de.yaml
  name: ev-panel-niro
  device_friendly: EV Panel — Niro

  # ═══ HA entities — everything this panel reads or writes ═══════════════════
  # Grouped by type, then in screen order (page 1 → 3, statusbar last).
  # ── sensor ──────────────────────────────────────────────────────────────────
  # Ladeplan target (evcc effectivePlanSoc via HA bridge) — > 0 = plan active.
  ha_plan_soc: sensor.evcc_ladeplan_ziel
  # Wallbox charging power — the Warp3's own meter, in W (all consumers /1000).
  ha_wb_power: sensor.warp3_2iw7_powernow
  # evcc solar share of the loadpoints (%, HA bridge) — splits the badge into Netz/PV.
  ha_wb_green_share: sensor.evcc_solaranteil_ladepunkte
  # Native Kia range (km). Replaces the old @16kWh/100km template estimate.
  ha_range_sensor: sensor.niro_ev_range
  # SOC = EV TRACTION battery (sensor.niro_ev_battery_level, ~77%).
  # NOT sensor.niro_car_battery_level — that's the 12 V aux battery (~90%).
  ha_soc_sensor: sensor.niro_ev_battery_level
  # Energy page: arc power in W ...
  ha_en_pv_power: sensor.dash_pv_input_power
  ha_en_house_power: sensor.dash_house_consumption
  # WP + Boiler — Shelly Pro 3EM channel 0 ALONE (single-phase, don't sum 0/1/2).
  ha_en_wp_power: sensor.heizungsraum_wp_und_boiler_energy_meter_0_power
  ha_en_grid_import_power: sensor.dash_grid_import_power
  ha_en_grid_export_power: sensor.dash_grid_export_power
  ha_en_batt_charge_power: sensor.dash_battery_charge_power
  ha_en_batt_discharge_power: sensor.dash_battery_discharge_power
  ha_en_batt_soc: sensor.batteries_state_of_capacity
  # ... per-line power for the LED chase (W) ...
  ha_en_line_pv_house: sensor.dash_pv_to_house
  ha_en_line_pv_grid: sensor.dash_pv_to_grid
  ha_en_line_pv_batt: sensor.dash_pv_to_batteries
  ha_en_line_grid_house: sensor.dash_grid_to_house
  ha_en_line_grid_batt: sensor.dash_grid_to_batteries
  ha_en_line_batt_house: sensor.dash_battery_to_house
  # ... "Strom heute" table: daily energy (kWh) + prices (CHF/kWh).
  ha_en_pv_daily: sensor.dash_pv_input_energy_daily
  ha_en_batt_in_daily: sensor.dash_battery_charge_energy_daily
  ha_en_batt_out_daily: sensor.dash_battery_discharge_energy_daily
  ha_en_grid_in_daily: sensor.dash_grid_import_energy_daily
  ha_en_grid_out_daily: sensor.dash_grid_export_energy_daily
  ha_en_house_daily: sensor.dash_house_consumption_energy_daily
  # YAML utility_meter on the Shelly ch0 hardware counter (utility_meter/waermepumpe.yaml).
  # NOT sensor.wp_und_boiler_daily_energy — that old UI helper counts a vanished source, stays 0.
  ha_en_wp_daily: sensor.daily_energy_warmepumpe
  # EV charged today — evcc (Warp3 meter), not the old Kia-cloud integral template.
  ha_en_ev_daily: sensor.evcc_heute_geladen
  ha_en_price_import: sensor.dash_price_import
  ha_en_price_export: sensor.dash_price_export
  # Weather page: 5-day forecast highs/lows (HA templates ev_panel_weather.yaml).
  ha_we_d0_high: sensor.evp_weather_d0_high
  ha_we_d0_low: sensor.evp_weather_d0_low
  ha_we_d1_high: sensor.evp_weather_d1_high
  ha_we_d1_low: sensor.evp_weather_d1_low
  ha_we_d2_high: sensor.evp_weather_d2_high
  ha_we_d2_low: sensor.evp_weather_d2_low
  ha_we_d3_high: sensor.evp_weather_d3_high
  ha_we_d3_low: sensor.evp_weather_d3_low
  ha_we_d4_high: sensor.evp_weather_d4_high
  ha_we_d4_low: sensor.evp_weather_d4_low
  # Cistern: fill %, volume m³, daily usage m³.
  ha_ci_fill: sensor.cistern_controller_zisterne_fill
  ha_ci_m3: sensor.cistern_controller_zisterne_m3
  ha_ci_usage: sensor.cistern_controller_zisterne_daily_usage
  # ── binary_sensor ───────────────────────────────────────────────────────────
  ha_wb_cable: binary_sensor.warp3_2iw7_cable
  ha_wb_charging: binary_sensor.warp3_2iw7_charging
  ha_wb_error: binary_sensor.warp3_2iw7_error
  ha_ci_pump: binary_sensor.cistern_controller_pumpe_lauft
  # evcc reachable (LWT evcc/status, HA bridge) — statusbar "evcc" dot.
  ha_statusbar_evcc_online: binary_sensor.evcc_online
  # ── select / lock / sun / text (read as text_sensor) ───────────────────────
  # evcc charge mode (HA bridge packages/evcc_wallbox.yaml). Also written by the
  # Schnellladen button.
  ha_wb_mode_select: select.evcc_lademodus
  # Must match the options of select.evcc_lademodus (HA bridge) exactly.
  evcc_mode_off: "Aus"
  evcc_mode_smart: "Smart"
  evcc_mode_now: "Schnell"
  # evcc "Dauerhaft laden" — settings popup (gear on the wallbox card).
  # Options must match select.evcc_dauerhaft_laden (HA bridge) exactly.
  ha_wb_always_charge_select: select.evcc_dauerhaft_laden
  evcc_always_off: "Aus"
  evcc_always_on: "Ein"
  ha_lock_entity: lock.niro_door_lock
  ha_we_d0_cond: sensor.evp_weather_d0_cond
  ha_we_d1_cond: sensor.evp_weather_d1_cond
  ha_we_d2_cond: sensor.evp_weather_d2_cond
  ha_we_d3_cond: sensor.evp_weather_d3_cond
  ha_we_d4_cond: sensor.evp_weather_d4_cond
  ha_ci_rain_text: sensor.evp_letzter_regen_text
  # Not on screen: above/below horizon picks day vs night backlight brightness.
  ha_sun: sun.sun
  # ── input_number ────────────────────────────────────────────────────────────
  # Unplugged + SOC ≥ idle → calm idle; < idle → red warning; < blink → blinks.
  ha_wb_idle_soc_threshold: input_number.ev_idle_soc_threshold
  ha_wb_blink_soc_threshold: input_number.ev_blink_soc_threshold
  # ── write-only (homeassistant.action targets) ───────────────────────────────
  ha_lock_windows_open_button: button.parkplatz_niro_open_all_windows
  ha_lock_windows_close_button: button.parkplatz_niro_close_all_windows
  ha_climate_entity: climate.niro_climate_control
  # "Bis morgen früh voll laden": HA script that sets (soc > 0) or deletes
  # (soc 0) the evcc charge plan — it holds the evcc vehicle name and computes
  # the next occurrence of the time. Target and time as in the evcc dialog.
  ha_plan_script: script.evcc_ladeplan_bis_morgen
  plan_target_soc: "90"
  plan_target_time: "07:00"

  dim_timeout_s: "60"

  # ─── Local climate sensors (bus_b) ───────────────────────────────────────
  sensors_sda: GPIO22        # P1 pin 14 (ADC1_CH6) — plain GPIO, fine for I²C SDA
  sensors_scl: GPIO33        # P1 pin 22 — plain GPIO. NB: GPIO24 (the obvious next
                             # pin) is USB1P1_N0, a USB-host data line → can't drive
                             # I²C SCL; using it scanned "no devices".
  scd40_altitude_m: "430"    # CO₂ altitude compensation — your installation altitude in m
  co2_warn_ppm: "1400"       # air banner ON >1400 ppm, OFF <1300 (−100 hysteresis)
  humidity_warn_pct: "70"    # air banner ON >=70 %, OFF <68 % (−2 hysteresis)

  # ─── Vehicle-specific UI ────────────────────────────────────────────────
  vehicle_section_title: "NIRO EV"
  vehicle_watermark_filename: "Kia_Niro_EV_watermark.png"

  # ─── Asset path ─────────────────────────────────────────────────────────
  # Point this at wherever the PNGs live, relative to /config/esphome/.
  # Default for new installs: ev-panel/icons.  Existing setups: ev-panel/icons.
  icons_path: ev-panel/icons

  # ─── online_image asset host (Phase 2) ──────────────────────────────────
  # HA (port 8123) serves /config/www/ at /local/. PNGs live in www/ev-panel/icons/.
  # LAN HTTP, no TLS. Use an address of HA the panel can reach directly
  # (e.g. "http://192.168.1.10:8123/local/ev-panel/icons") — set it in secrets.yaml.
  asset_base: !secret ev_panel_asset_base

  # ─── Cistern waterline (page 3) — three points, px from the tank's top-left ─
  # render_cistern places the waterline image's top-left at these offsets from
  # ci_tank's top-left and interpolates linearly 100→50 % and 50→0 %. Tune on the
  # device. Starting values = the old auto-centred position: x (600−360)/2 + 10.
  cistern_wl_100_x: "130"   # full
  cistern_wl_100_y: "155"
  cistern_wl_50_x:  "130"
  cistern_wl_50_y:  "278"
  cistern_wl_0_x:   "130"   # empty
  cistern_wl_0_y:   "400"


  # ─── Color palette — single source of truth (mockup-portrait-v2.html) ────
  paper:        "0xf4ecdf"   # warm cream — main background
  paper_tint:   "0xecdfca"   # slightly deeper, for alt bands (climate strip)
  paper_edge:   "0xd8c9ae"   # hairline rules between sections
  ink:          "0x1a1a1a"   # primary text
  ink_soft:     "0x4a3f2e"   # secondary text — warm
  ink_mute:     "0x8a7d68"   # tertiary / labels — warm grey
  ink_faint:    "0xbfb5a3"   # off / muted state
  warn_red:     "0xa81d1d"   # warnings (deep ink-red, not neon)
  ok_green:     "0x04B503"   # universal green

