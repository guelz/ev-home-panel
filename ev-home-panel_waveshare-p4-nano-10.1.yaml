  #wifi_ota_api: !include common/wifi_ota_api.yaml
  ev_panel.fonts:          !include ev-panel/common/fonts.yaml
  ev_panel.placeholder:    !include ev-panel/common/images_placeholder.yaml
  ev_panel.images:         !include ev-panel/common/images_online.yaml
  ev_panel.globals:        !include ev-panel/common/globals.yaml
  ev_panel.ha_entities:    !include ev-panel/common/ha_entities.yaml
  ev_panel.http_polling:   !include ev-panel/common/http_polling.yaml
  ev_panel.scripts_ui:     !include ev-panel/common/scripts_ui.yaml
  ev_panel.scripts_render: !include ev-panel/common/scripts_render.yaml
  ev_panel.scripts_lock:   !include ev-panel/common/scripts_lock.yaml
  ev_panel.scripts_charge_now: !include ev-panel/common/scripts_charge_now.yaml
  ev_panel.scripts_settings: !include ev-panel/common/scripts_settings.yaml
  ev_panel.controls:       !include ev-panel/common/controls.yaml
  ev_panel.audio:          !include ev-panel/common/audio.yaml

# =============================================================================
# Hardware — ESP32-P4 ECO2 / Waveshare ESP32-P4-NANO / 10.1" DSI panel
# =============================================================================
# DO NOT TOUCH! (unless you really have to, then it's ok!)
# Each setting is required for ESP32-P4 ECO2 silicon (rev1.3) on this board.
# Removing or "simplifying" any of them tends to brick the boot at the
# second-stage bootloader.
#   - engineering_sample: true  → required since ESPHome 2026.3.0 (PR #14139)
#                                  for any pre-rev-3 silicon (our chip is rev1.3)
#   - psram.mode: hex           → ESP32-P4 only supports hex (16-line) PSRAM
#   - psram.speed: 200MHz       → gated behind enable_idf_experimental_features
#   - esp_ldo channel 3 @ 2.5V  → powers in-package PSRAM/MIPI rail
#   - cpu_frequency: 360MHz     → 400MHz is experimental on P4 (PR #13433)
#   - logger UART0              → USB-C is a CH343P USB↔UART bridge on UART0
#                                (GPIO37/38). USB_SERIAL_JTAG routes to the native
#                                USB pins = USB-A port (J2), NOT the USB-C, so JTAG
#                                logs never reach the debug cable. (#15724 was wrong.)
esphome:
  name: ${name}
  friendly_name: ${device_friendly}
  name_add_mac_suffix: false
  on_boot:
    # Priority 850: AFTER i2c bus init (900) but BEFORE display init (~250).
    # Wakes the Waveshare 10.1" panel PMIC at I²C 0x45 so DSI doesn't hang on boot.
    # Reference: https://github.com/esphome/esphome/issues/15564
    - priority: 850
      then:
        - logger.log: "[panel] running I²C wake sequence on chip 0x45"
        - lambda: |-
            id(panel_pmic).write_byte(0x95, 0x11);
            id(panel_pmic).write_byte(0x95, 0x17);
            id(panel_pmic).write_byte(0x96, 0x00);
        - delay: 100ms
        - lambda: |-
            id(panel_pmic).write_byte(0x96, 0xFF);   // backlight to full
        - delay: 300ms
        - logger.log: "[panel] wake sequence complete"
        - script.execute: hide_loading_spinners   # hide page spinners once assets land
    # Priority -100: after all components are set up — push the restored volume to
    # the ES8311 (template number restore_value does not auto-fire set_action).
    - priority: -100
      then:
        - lambda: 'id(ev_codec)->set_volume(id(volume).state / 100.0f);'
    # Priority -200: re-apply the radar gate/timeout defaults each boot so a flash
    # (which resets the LD2412 config) doesn't lose them. 15 s delay lets the
    # LD2412 UART come up before we write. NB: this overwrites any live HA tweak
    # on the next reboot — these are intentionally fixed values.
    - priority: -200
      then:
        - delay: 15s
        - number.set: { id: radar_min_gate, value: 1 }
        - number.set: { id: radar_max_gate, value: 2 }
        - number.set: { id: radar_timeout,  value: 2 }

esp32:
  board: esp32-p4-evboard
  variant: esp32p4
  engineering_sample: true
  flash_size: 16MB
  cpu_frequency: 360MHz
  framework:
    type: esp-idf
    version: recommended
    advanced:
      enable_idf_experimental_features: yes
    sdkconfig_options:
      CONFIG_SPIRAM_XIP_FROM_PSRAM: "y"

psram:
  mode: hex
  speed: 200MHz

esp_ldo:
  - channel: 3
    id: display_supply_ldo
    voltage: 2.5V

logger:
  hardware_uart: UART0      # CH343P USB↔UART bridge → USB-C debug port (GPIO37/38)
  baud_rate: 115200
  level: debug

# Example configuration entry
#debug:
#  update_interval: 30s

api:
  encryption:
    key: !secret api_encryption_key
  actions:
    # Called by HA "Kabel vergessen" automation
    - action: blink_warning
      variables:
        headline: string
        duration: int
      then:
        - script.execute:
            id: blink_warning
            headline: !lambda 'return headline;'
            duration: !lambda 'return duration;'

ota:
  - platform: esphome
    # OTA-Verschlüsselung (ESPHome 2026.9+) in zwei Schritten:
    #  1) mit password flashen → Log zeigt "Encryption: offered, plaintext accepted"
    #  2) password raus, bare `encryption:` rein (nutzt den api-Key) → erneut flashen
    #password: !secret ota_password
    encryption:

time:
  - platform: homeassistant
    id: homeassistant_time
    # Required: ESPHome's time component defaults to UTC. Without this set,
    # localtime/mktime in lambdas return UTC-flavored values — breaks the
    # grandma rule check (hour) and the plan POST date math.
    timezone: "Europe/Zurich"
    on_time_sync:
      - script.execute: refresh_clock
    on_time:
      - seconds: 0
        minutes: '*'
        then:
          - script.execute: refresh_clock

#text_sensor:
