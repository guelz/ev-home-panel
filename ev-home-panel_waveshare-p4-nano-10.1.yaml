# I²C bus shared by GT911 touch (0x5D) + panel PMIC (0x45)
i2c:
  - id: bus_a
    sda: GPIO7
    scl: GPIO8
    frequency: 400kHz
  # Sensor bus — separate from the 400 kHz display/touch bus_a because the
  # SCD40 maxes out at 100 kHz. SHT41 (0x44) + SCD40 (0x62) live here.
  - id: bus_b
    sda: ${sensors_sda}
    scl: ${sensors_scl}
    frequency: 100kHz
    scan: true

# Panel PMIC (handles power-on sequence + backlight via register 0x96)
i2c_device:
  - id: panel_pmic
    i2c_id: bus_a
    address: 0x45

# MIPI-DSI display — universal id ev_display
display:
  - platform: mipi_dsi
    model: WAVESHARE-P4-NANO-10.1
    id: ev_display
    auto_clear_enabled: false  # LVGL manages the framebuffer
    update_interval: never     # LVGL drives its own redraws

# Touchscreen — universal id ev_touchscreen
touchscreen:
  - platform: gt911
    id: ev_touchscreen
    i2c_id: bus_a
    address: 0x5D
    transform:
      mirror_x: false
      mirror_y: false
      swap_xy: false
    # Horizontal swipe → page nav. Track start (on_touch) + latest x (on_update),
    # decide on release: |dx| > 100 px = next/prev page (LVGL widgets still get
    # their taps; we only act on a clear horizontal drag at release).
    on_touch:
      - lambda: |-
          ESP_LOGI("touch", "press   x=%d y=%d id=%d", touch.x, touch.y, touch.id);
          if (!id(swipe_active)) { id(swipe_start_x) = touch.x; id(swipe_active) = true; }
          id(swipe_last_x) = touch.x;
      - script.execute: wake_display
    on_update:
      - lambda: |-
          for (auto &t : touches) id(swipe_last_x) = t.x;
    on_release:
      - lambda: |-
          int dx = id(swipe_last_x) - id(swipe_start_x);
          id(swipe_active) = false;
          ESP_LOGI("touch", "release dx=%d", dx);
          if      (dx < -100) { id(show_page)->execute(id(current_page) + 1); }
          else if (dx >  100) { id(show_page)->execute(id(current_page) - 1); }

# Backlight — wraps an i2c write to panel PMIC chip 0x45 register 0x96
output:
  - platform: template
    id: backlight_pwm
    type: float
    write_action:
      - lambda: |-
          uint8_t value = (uint8_t)(state * 255.0f);
          id(panel_pmic).write_byte(0x96, value);

light:
  - platform: monochromatic
    id: backlight
    name: "${device_friendly} Backlight"
    output: backlight_pwm
    default_transition_length: 300ms
    restore_mode: ALWAYS_ON

# Onboard Ethernet (IP101 PHY) — preferred over WiFi when cable is connected
ethernet:
  type: IP101
  mdc_pin: GPIO31
  mdio_pin: GPIO52
  power_pin: GPIO51
  # NB: asset loading is NOT triggered on on_connect — the switch holds the port
  # in STP listening/learning for ~30 s after link-up, so early HTTP connects fail
  # (ESP_ERR_HTTP_CONNECT). load_assets is driven by a delayed+retrying interval
  # (http_polling.yaml) that starts past that window and retries until all loaded.
  clk:
    mode: CLK_EXT_IN
    pin: GPIO50
  phy_addr: 1
  manual_ip:
    static_ip: !secret ev_panel_static_ip
    gateway: !secret ev_panel_gateway
    subnet: !secret ev_panel_subnet
    dns1: !secret ev_panel_dns

# WiFi co-processor (ESP32-C6 over SDIO) — fallback / backup
esp32_hosted:
  active_high: true
  variant: ESP32C6
  reset_pin: GPIO54
  cmd_pin: GPIO19
  clk_pin: GPIO18
  d0_pin: GPIO14
  d1_pin: GPIO15
  d2_pin: GPIO16
  d3_pin: GPIO17

# =============================================================================
# Radar — HLK-LD2412 mmWave presence (only on the Niro Panel build)
# Replaced the LD2410B 2026-06-13. Hardware + binary_sensor stay device-local;
# the LVGL "Radar" dot lives in sections/statusbar.yaml (sb_radar_dot); the
# script that toggles its colour is defined here so it can be omitted on
# radar-less builds without breakage.
# NB: LD2412 runs at 115200 baud (the LD2410 used 256000); parity NONE / 1 stop.
# =============================================================================
uart:
  - id: radar_uart
    tx_pin: GPIO21
    rx_pin: GPIO20
    baud_rate: 115200      # LD2412 default (LD2410 was 256000)
    parity: NONE
    stop_bits: 1

ld2412:
  uart_id: radar_uart
  id: ev_radar

binary_sensor:
  - platform: ld2412
    has_target:
      id: ev_presence
      name: "${device_friendly} Presence"
      on_state:
        - script.execute: refresh_radar_dot
      on_press:
        - script.execute: wake_display
      on_release:
        - script.execute: dim_after_timeout
    has_moving_target:
      name: "${device_friendly} Presence Moving"
      entity_category: diagnostic
    has_still_target:
      name: "${device_friendly} Presence Still"
      entity_category: diagnostic
    # On while a Start-Dynamic-Background-Correction run is in progress.
    dynamic_background_correction_status:
      name: "${device_friendly} Radar Background Correction"
      entity_category: diagnostic

# Adjustable LD2412 detection range + presence timeout (HA number entities,
# values persist to the radar's own EEPROM). NB: the LD2412 uses a single
# min/max distance-gate pair — NOT the LD2410's separate move/still gates.
number:
  - platform: ld2412
    min_distance_gate:
      id: radar_min_gate
      name: "${device_friendly} Radar Min Distance"
      icon: mdi:arrow-collapse-left
    max_distance_gate:
      id: radar_max_gate
      name: "${device_friendly} Radar Max Distance"
      icon: mdi:arrow-expand-right
    timeout:
      id: radar_timeout
      name: "${device_friendly} Radar Presence Timeout"
      icon: mdi:timer-outline
    light_threshold:
      name: "${device_friendly} Radar Light Threshold"
      icon: mdi:brightness-6
      entity_category: diagnostic

# Dynamic background correction — recalibrates the radar's noise floor. Keep the
# area clear of people for ~10 s after pressing; progress shows on the
# dynamic_background_correction_status binary_sensor above.
button:
  - platform: ld2412
    start_dynamic_background_correction:
      name: "${device_friendly} Radar Start Background Correction"
      icon: mdi:radar

# =============================================================================
# Local climate sensors — SHT41 (temp/humidity) + SCD40 (CO₂) on bus_b.
# SHT41 is the primary/shown temp+humidity; SCD40 temp/humidity are diagnostic
# so HA's primary temp/humidity stay the SHT41's. Heater on the SHT41 stays off
# (component default) to avoid self-heating bias.
# =============================================================================

# Air-quality warning latches (hysteresis state for check_air_quality).
globals:
  - id: co2_warn_on
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: hum_warn_on
    type: bool
    restore_value: no
    initial_value: 'false'

sensor:
  - platform: sht4x
    i2c_id: bus_b
    address: 0x44
    update_interval: 30s
    temperature:
      id: sht41_temp
      name: "${device_friendly} Raumtemperatur"
      filters:
        - lambda: 'return x + id(temp_offset).state;'   # HA-tunable calibration offset
      on_value:
        - script.execute: refresh_local_temp
    humidity:
      id: sht41_humidity
      name: "${device_friendly} Luftfeuchtigkeit"
      filters:
        - lambda: 'return x + id(humidity_offset).state;'   # HA-tunable calibration offset
      on_value:
        - script.execute: check_air_quality

  - platform: scd4x
    i2c_id: bus_b
    address: 0x62
    update_interval: 60s
    altitude_compensation: ${scd40_altitude_m}m
    co2:
      id: scd40_co2
      name: "${device_friendly} CO₂"
      on_value:
        - script.execute: check_air_quality
    temperature:
      id: scd40_temp
      name: "${device_friendly} CO₂-Sensor Temperatur"
      entity_category: diagnostic
    humidity:
      id: scd40_humidity
      name: "${device_friendly} CO₂-Sensor Luftfeuchtigkeit"
      entity_category: diagnostic

# refresh_radar_dot — toggles sb_radar_dot in sections/statusbar.yaml.
# Lives next to the LD2412 binary_sensor that fires it.
script:
  # Air-quality banner: ON CO2>1400/hum>=70, OFF <1300/<68 (hysteresis latches).
  # NB rendered text uses "CO2" — font_status has no subscript-₂ glyph.
  - id: check_air_quality
    then:
      - lambda: |-
          float co2 = id(scd40_co2).state;
          float hum = id(sht41_humidity).state;
          if (!std::isnan(co2)) {
            if (co2 > ${co2_warn_ppm}) id(co2_warn_on) = true;
            else if (co2 < ${co2_warn_ppm} - 100) id(co2_warn_on) = false;
          }
          if (!std::isnan(hum)) {
            if (hum >= ${humidity_warn_pct}) id(hum_warn_on) = true;
            else if (hum < ${humidity_warn_pct} - 2) id(hum_warn_on) = false;
          }
          if (id(co2_warn_on) || id(hum_warn_on)) {
            char buf[64];
            if (id(co2_warn_on) && id(hum_warn_on))
              snprintf(buf, sizeof(buf), "${txt_air_both_fmt}", co2, hum);
            else if (id(co2_warn_on))
              snprintf(buf, sizeof(buf), "${txt_air_co2_fmt}", co2);
            else
              snprintf(buf, sizeof(buf), "${txt_air_hum_fmt}", hum);
            lv_label_set_text(id(air_warning_label), buf);
            lv_obj_clear_flag(id(air_warning_banner), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(id(air_warning_banner), LV_OBJ_FLAG_HIDDEN);
          }

  - id: refresh_radar_dot
    then:
      - lambda: |-
          bool present = id(ev_presence).state;
          lv_obj_set_style_bg_color(id(sb_radar_dot),
            lv_color_hex(present ? $ok_green : $ink_faint), 0);

  # Hide the per-page loading spinners once all online_image assets are in
  # (assets_loaded is set by refresh_after_assets). Device-local: the spinner
  # ids only exist on this build. 90 s timeout so they can't spin forever if an
  # asset never loads.
  - id: hide_loading_spinners
    then:
      - wait_until:
          condition:
            lambda: 'return id(assets_loaded);'
          timeout: 90s
      - lvgl.widget.hide: spin_main
      - lvgl.widget.hide: spin_energy
      - lvgl.widget.hide: spin_cistern

  # Writes the SHT41 room temperature into the statusbar sb_temp label.
  # Device-local (references the device-local sht41_temp), mirroring refresh_radar_dot.
  - id: refresh_local_temp
    then:
      - lambda: |-
          if (std::isnan(id(sht41_temp).state)) { lv_label_set_text(id(sb_temp), "—"); return; }
          char buf[16];
          snprintf(buf, sizeof(buf), "%.1f°", id(sht41_temp).state);
          lv_label_set_text(id(sb_temp), buf);

# =============================================================================
# LVGL — 5 sections matching the mockup (800×1280 portrait)
# =============================================================================
lvgl:
  displays: [ev_display]
  byte_order: little_endian      # required for RGB565 to render correctly on this panel
  buffer_size: 100%              # full-frame buffer in PSRAM (we have 32MB)
  bg_color: $paper
  text_color: $ink
  text_font: font_label
  touchscreens: [ev_touchscreen]

  # Shared bottom status bar (clock + connectivity dots + page-dots) — same on every page.
  top_layer:
    widgets:
      - !include ev-panel/sections/statusbar.yaml
      - !include ev-panel/sections/air_warning.yaml
      - !include ev-panel/sections/settings_popup.yaml   # last = above everything

  pages:
    - id: main_page
      bg_color: $paper
      width: 800
      height: 1280
      pad_all: 0
      pad_bottom: 60          # keep content clear of the bottom statusbar
      layout:
        type: FLEX
        flex_flow: COLUMN
        pad_row: 0
      widgets:
        # "Schnellladen" button on top (Ladeplan was removed in the HA-as-hub migration).
        - !include ev-panel/sections/charge_now.yaml
        - !include ev-panel/sections/wallbox.yaml
        - !include ev-panel/sections/vehicle.yaml
        - !include ev-panel/sections/lock.yaml
        - !include ev-panel/sections/climate.yaml
        - !include { file: ev-panel/sections/loading_spinner.yaml, vars: { spin_id: spin_main } }
    - id: energy_page
      bg_color: $paper
      width: 800
      height: 1280
      pad_all: 0
      pad_bottom: 60          # clear the bottom statusbar
      widgets:
        - !include ev-panel/sections/energy_leds.yaml
        - !include ev-panel/sections/energy.yaml
        - !include ev-panel/sections/energy_cost.yaml
        - !include { file: ev-panel/sections/loading_spinner.yaml, vars: { spin_id: spin_energy } }
    - id: cistern_page
      bg_color: $paper
      width: 800
      height: 1280
      pad_all: 0
      pad_bottom: 60          # clear the bottom statusbar
      widgets:
        - !include ev-panel/sections/weather.yaml   # upper half (y 0-640)
        - !include ev-panel/sections/cistern.yaml   # lower half (y 640-1220)
        - !include { file: ev-panel/sections/loading_spinner.yaml, vars: { spin_id: spin_cistern } }
